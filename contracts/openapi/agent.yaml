openapi: 3.1.0
info:
  title: Tiresias agent API
  version: 0.1.0-draft
  description: Draft contract (ADR-0002). Endpoints are marked with their implementation status.
servers: [{url: http://localhost:8000}]
paths:
  /health:
    get:
      summary: Liveness, with mode and dependency reachability (implemented)
      description: >
        Never waits on a dependency. zetaris_cache reports the background Zetaris cache warm the
        API starts in live mode (ZETARIS_WARM_ON_START, BACKLOG B-20); in sample mode it is "off".
        zetaris reports the last Zetaris liveness probe (taken before a live run, never by this
        endpoint) and the companyfacts tables kept cached under ZETARIS_MAX_CACHED_FACTS (B-24).
      responses: {"200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}}
  /run:
    post:
      summary: Run an investigation synchronously (implemented; Loop A then Loop B, sample mode by default)
      description: >
        Starts the run in the registry (so GET /runs/{run_id} and its events also work) and waits up
        to RUN_BUDGET_SECONDS + 30 s. A run that ends in a controlled failure is still 200 with
        RunResult.status "error"; 5XX means the pipeline itself raised or the wait ran out.
      parameters: [{$ref: "#/components/parameters/XRunId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RunRequest"}}}
      responses:
        "200": {description: Completed (X-Run-Id echoed), content: {application/json: {schema: {$ref: "#/components/schemas/RunResult"}}}}
        "409": {description: X-Run-Id already in the registry, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Invalid body, JSON or X-Run-Id (type ValidationError), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: MAX_CONCURRENT_RUNS already running (recoverable), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "500": {description: The pipeline raised (recoverable flag; never a stack trace), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "504": {description: "Not finished within the budget (type RunTimeout, recoverable; poll GET /runs/{run_id})", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs:
    post:
      summary: Start an investigation in the background (implemented)
      parameters: [{$ref: "#/components/parameters/XRunId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RunRequest"}}}
      responses:
        "202":
          description: Started (X-Run-Id echoed)
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status, depth]
                properties:
                  run_id: {type: string}
                  status: {const: running}
                  events: {type: string, description: Path of the SSE stream}
                  depth: {$ref: "#/components/schemas/RunDepth", description: "The depth the run starts at and its expected wait (ADR-0011), so a UI can say how long to wait"}
        "409": {description: X-Run-Id already in the registry, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Invalid body, JSON or X-Run-Id, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: MAX_CONCURRENT_RUNS already running (recoverable), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs/{run_id}:
    get:
      summary: Status of a run, with its RunResult once done (implemented; in-memory, last RUNS_REGISTRY_SIZE runs)
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Run status, content: {application/json: {schema: {$ref: "#/components/schemas/RunStatus"}}}}
        "404": {description: Unknown or evicted (type RunNotFound), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs/{run_id}/events:
    get:
      summary: The run's trace lines as Server-Sent Events (implemented)
      description: >
        Replays every kept trace line from the start, then streams live ones. Each `event: trace`
        carries one JSONL trace line (docs/architecture.md#tracing) as `data:`. A comment line
        `: keepalive` is sent after 15 s without a line. The stream ends with one `event: end` whose
        data is {run_id, status, run_status?, end_state?, error?}, or after RUN_BUDGET_SECONDS + 30 s.
        For progress UIs, slow phases are bracketed by trace lines with agent `orchestrator` and
        action `phase_start` / `phase_done` (field `phase`: resolve_entity, scope_check,
        register_entity, loop_a, frame, recall, loop_b, scout, onboard, reconcile, remember; `phase_done` carries duration_ms), and
        action `heartbeat` (same `phase`, `elapsed_ms`) every PHASE_HEARTBEAT_SECONDS (default 5)
        while a phase runs (docs/agents-reference.md "Run phases (for UI)").
        Human-in-the-loop gates (hitl_mode interactive) appear as agent `gate` lines: action
        `waiting` (a GateWaiting's fields: gate_id, gate, question, options, proposal, node_id,
        requested_by, context, deadline, timeout_seconds; gate_mode interactive), then `answered`
        (decided_by human, choice, note) or `expired` (status degraded, decided_by timeout), then
        the `decide` line every gate writes (gate_mode, decided_by, choice, note, gate_id).
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Event stream, content: {text/event-stream: {schema: {type: string}}}}
        "404": {description: Unknown or evicted (type RunNotFound), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs/{run_id}/gates:
    get:
      summary: The run's interactive gates, oldest first, and the one waiting (implemented)
      description: >
        A run whose hitl_mode is interactive (RunOptions.hitl_mode, else HITL_MODE) waits at each
        gate (critic_escalation, source, memory) on its own thread until it is answered with
        POST /runs/{run_id}/gates/{gate_id}, or for GATE_TIMEOUT_SECONDS (default 120, clamped
        0.1..1800, never past the run budget left); then the policy's proposal applies
        (decided_by timeout). Empty for auto and scripted runs, whose gates decide at once.
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: The run's gates, content: {application/json: {schema: {$ref: "#/components/schemas/GateList"}}}}
        "404": {description: Unknown or evicted (type RunNotFound), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs/{run_id}/gates/{gate_id}:
    post:
      summary: Answer a waiting gate; the run resumes with this choice (implemented)
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - {name: gate_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/GateAnswer"}}}
      responses:
        "200": {description: "The answered gate (status answered, decided_by human)", content: {application/json: {schema: {$ref: "#/components/schemas/GateWaiting"}}}}
        "404": {description: "Unknown run (RunNotFound) or gate, or a run without interactive gates (GateNotFound)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: "Already answered (GateAlreadyAnswered) or expired (GateExpired)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: "A choice that is not one of the gate's options, or an invalid body (ValidationError)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /entities:
    get:
      summary: Companies to ask about, for a picker with type-ahead (implemented)
      description: >
        Tier "ready" = registered already (live - the entity's Zetaris facts table, filings view
        and a supported metric view; sample - the data/sample/ slice), so a run starts at once.
        Tier "searchable" (live only, with q of 2+ characters) = any SEC registrant in the Zetaris
        view tiresias.sec_tickers matching the ticker, CIK or name; a run registers it first.
        Sample mode lists only the slice and says why in `note`. Each entity carries the measured
        expected first-run wait (docs/measurements/live-any-company.md). Emits `api` trace lines
        to trace-<X-Run-Id>.jsonl, else trace-api-YYYYMMDD.jsonl.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: "Ticker, CIK or part of the name"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: sample_mode, in: query, schema: {type: boolean}, description: Defaults to SAMPLE_MODE}
        - {$ref: "#/components/parameters/XRunId"}
      responses:
        "200": {description: Entities, content: {application/json: {schema: {$ref: "#/components/schemas/EntityList"}}}}
        "422": {description: Invalid query (type ValidationError), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /entities/{cik}/suggestions:
    get:
      summary: Questions derived from the entity's own filed data, each a RunRequest to post as-is (implemented)
      description: >
        Restatements (two annual filings that disagree on the same fiscal year; most recent first),
        the largest year-on-year changes, and the lowest / highest annual value, for Revenues and
        NetIncomeLoss. Each is validated by the framer on the same data (registered entity, metric
        present, the intended kind of effect, relative change at least 1%) before it is returned.
        Neutral wording. Only for a ready (registered) entity.
      parameters:
        - {name: cik, in: path, required: true, schema: {type: string, pattern: "^[0-9]{1,10}$"}}
        - {name: role, in: query, schema: {type: string, enum: [analyst, auditor, board], default: analyst}, description: "Asker of the suggested requests (default levers per role)"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 12}}
        - {name: sample_mode, in: query, schema: {type: boolean}}
        - {$ref: "#/components/parameters/XRunId"}
      responses:
        "200": {description: Suggestions, content: {application/json: {schema: {$ref: "#/components/schemas/SuggestionList"}}}}
        "404": {description: "Not an SEC registrant (EntityNotFound, live) or not in the sample (EntityNotInSample)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: "An SEC registrant not registered in Zetaris yet (EntityNotRegistered): run any question about it first", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Invalid CIK or query (ValidationError), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /runs/{run_id}/branch:
    post:
      summary: Branch from a node of a finished run with a new question or asker (planned; returns a structured 501)
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content: {application/json: {schema: {$ref: "#/components/schemas/BranchRequest"}}}
      responses: {"200": {description: New run, content: {application/json: {schema: {$ref: "#/components/schemas/RunResult"}}}}}
  /memory/purge:
    post:
      summary: Purge H-MEM lessons (proxied to cognition; recorded in its trust ledger) (implemented)
      description: >
        Calls the cognition service's POST /memory/purge (adapters/cognition.py CognitionClient.purge)
        and reports the count cognition confirmed. Never reports a purge that did not happen: an
        unreachable cognition is 503 MemoryUnavailable, a refused or malformed reply 502 MemoryError.
        One `api` trace line `memory_purge` (status success or error) goes to trace-<X-Run-Id>.jsonl,
        else trace-api-YYYYMMDD.jsonl. The namespace query parameter overrides body.namespace; omit
        both to purge every namespace.
      parameters:
        - {name: namespace, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/XRunId"}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/PurgeRequest"}}}
      responses:
        "200": {description: Purged (count confirmed by cognition), content: {application/json: {schema: {$ref: "#/components/schemas/PurgeResult"}}}}
        "422": {description: Invalid body or X-Run-Id (ValidationError), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "502": {description: Cognition refused the purge or gave no purged count (MemoryError); nothing is reported purged, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Cognition unreachable (MemoryUnavailable, recoverable); nothing is reported purged, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
components:
  parameters:
    XRunId:
      name: X-Run-Id
      in: header
      required: false
      description: Run id to use (else one is generated); echoed in the X-Run-Id response header, on every trace line and in the trace file name
      schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,100}$"}
  schemas:
    Health:
      type: object
      required: [service, version, sample_mode, hitl_mode, zetaris_cache, zetaris]
      properties:
        service: {type: string, const: agent}
        version: {type: string}
        sample_mode: {type: boolean}
        hitl_mode: {type: string}
        zetaris_cache: {$ref: "#/components/schemas/ZetarisCache"}
        zetaris: {$ref: "#/components/schemas/ZetarisHealth"}
    ZetarisHealth:
      type: object
      description: >
        Zetaris as this process last saw it (adapters/zetaris.py LIVENESS and FACTS_CACHE). The
        liveness probe (zetaris/sql/42_liveness.sql, SELECT 1 AS alive, 3 s, no retry) runs before
        a live run and its result is reused for ZETARIS_LIVENESS_TTL_SECONDS; this endpoint only
        reads it.
      required: [state, cached_facts, max_cached_facts]
      properties:
        state:
          type: string
          enum: ["off", not-checked, alive, down, inconclusive]
          description: >
            off: sample mode; not-checked: no live run has probed yet; alive: answered; down: a
            timeout, connection error, 5xx or a dead-engine reply (stopped SparkContext), so runs
            serve the offline sample; inconclusive: refused otherwise (e.g. auth), runs go ahead live.
        reason: {type: string}
        checked_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        cached_facts: {type: array, items: {type: string}, description: "companyfacts raw tables this process cached, least recently used first"}
        max_cached_facts: {type: integer, description: ZETARIS_MAX_CACHED_FACTS (1..50, default 5)}
        pinned: {type: array, items: {type: string}, description: "tables a running run needs; never evicted"}
    ZetarisCache:
      type: object
      description: >
        Progress of the Zetaris cache warm on start (adapters/zetaris.py warm_on_start): re-issues
        CACHE TABLE for every registered companyfacts, submissions and ticker-map raw table, one
        at a time, in a daemon thread that never delays or stops the API.
      required: [state]
      properties:
        state:
          type: string
          enum: ["off", not-started, warming, warm, partial, failed]
          description: >
            off: sample mode, ZETARIS_WARM_ON_START off or ZETARIS_REST_URL unset (see reason);
            warming: done of total tables so far; warm: every table re-cached; partial: some
            failed or were skipped for ZETARIS_WARM_BUDGET_SECONDS; failed: none re-cached, or the
            table list could not be read (see error).
        reason: {type: string}
        total: {type: integer}
        done: {type: integer}
        counts: {type: object, additionalProperties: {type: integer}, description: "Tables per outcome: warmed, absent, failed, skipped"}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        error: {type: string}
    RunStatus:
      type: object
      required: [run_id, status, created_at, events]
      properties:
        run_id: {type: string}
        status: {type: string, enum: [running, done]}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        events: {type: integer, description: Trace lines kept in memory}
        dropped_events: {type: integer, description: Lines beyond MAX_TRACE_LINES_PER_RUN (still in the trace file)}
        trace_file: {type: [string, "null"]}
        hitl_mode: {type: string, description: "The run's gate mode (auto, interactive, scripted)"}
        waiting_gate:
          oneOf: [{$ref: "#/components/schemas/GateWaiting"}, {type: "null"}]
          description: The interactive gate the run is waiting at (answer it with POST /runs/{run_id}/gates/{gate_id}), else null
        result: {oneOf: [{$ref: "#/components/schemas/RunResult"}, {type: "null"}]}
        error:
          type: [object, "null"]
          description: Set when the pipeline raised (the run is done without a RunResult)
          properties: {type: {type: string}, message: {type: string}, recoverable: {type: boolean}}
    GateAnswer:
      type: object
      required: [choice]
      additionalProperties: false
      properties:
        choice: {type: string, minLength: 1, maxLength: 64, description: "One of the gate's options"}
        note: {type: [string, "null"], maxLength: 500, description: "Kept in the trace, scrubbed of secrets"}
    GateWaiting:
      type: object
      required: [gate_id, gate, status, question, options, proposal, created_at, deadline, timeout_seconds]
      properties:
        gate_id: {type: string, description: "g1, g2, ... in the order the run reached them"}
        gate: {type: string, enum: [framing, source, critic_escalation, memory]}
        status: {type: string, enum: [waiting, answered, expired]}
        question: {type: string}
        options: {type: array, items: {type: string}}
        proposal: {type: string, description: "The requesting agent's proposal: what auto would choose, and what a timeout applies"}
        node_id: {type: [string, "null"]}
        requested_by: {type: string}
        context: {type: object, description: "The evidence the decision rests on (share, claim, entity, cik, tags...), scrubbed: secret keys and bearer tokens masked, strings cut to 300 characters"}
        created_at: {type: string, format: date-time}
        deadline: {type: string, format: date-time, description: "UTC; past it the proposal applies (decided_by timeout)"}
        timeout_seconds: {type: number, description: "GATE_TIMEOUT_SECONDS capped at the run budget left"}
        choice: {type: [string, "null"]}
        note: {type: [string, "null"]}
        decided_by: {type: [string, "null"], enum: [human, timeout, null]}
        answered_at: {type: [string, "null"], format: date-time}
    GateList:
      type: object
      required: [run_id, hitl_mode, gates]
      properties:
        run_id: {type: string}
        hitl_mode: {type: string}
        waiting_gate: {oneOf: [{$ref: "#/components/schemas/GateWaiting"}, {type: "null"}]}
        gates: {type: array, items: {$ref: "#/components/schemas/GateWaiting"}}
    Asker:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [analyst, auditor, board]}
        levers: {type: array, items: {type: string}}
        horizon: {type: string}
    RunRequest:
      type: object
      required: [question, entity, metric, period, asker]
      properties:
        question: {type: string}
        entity:
          type: object
          description: >-
            The asked registrant. Sample mode covers only the offline slice (GE, GEHC, GEV, MMM, SOLV);
            live mode resolves any SEC registrant through the Zetaris sec_tickers view and
            registers it behind the source gate.
          properties:
            ticker: {type: string}
            cik: {type: string}
            name: {type: string, description: "Used only when neither ticker nor CIK is given"}
        metric: {type: string}
        period:
          type: object
          required: [start, end]
          properties: {start: {type: string, format: date}, end: {type: string, format: date}}
        compare: {type: object}
        asker: {$ref: "#/components/schemas/Asker"}
        options:
          type: object
          properties:
            hitl_mode: {type: string, enum: [auto, interactive, scripted]}
            memory: {type: string, enum: [warm, cold], description: "warm: recall H-MEM lessons, let the critic judge them and store the run's lesson behind the memory gate (ADR-0005); cold: no memory call. Default MEMORY_MODE (warm); MEMORY_MODE=off makes every run cold"}
            sample_mode: {type: boolean}
            decisions: {type: object, description: Scripted gate decisions}
            depth: {type: string, enum: [quick, thorough, deep], description: "Investigation depth (ADR-0011). quick (default): rules only; thorough: rules + the critic's deep-lane second opinion; deep: every model lane (hypothesiser, critic second opinion, reporter wording). Sample mode makes no model call at any depth; MODEL_LANES=off forces quick. RunResult.depth and the POST /runs 202 body say what runs and the expected wait"}
            model_lanes: {type: string, enum: [auto, "on", "off"], deprecated: true, description: "Deprecated (ADR-0011): use depth. on = deep, off = quick, auto = as if absent; ignored when depth is set. Still accepted"}
    BranchRequest:
      type: object
      required: [node_id]
      properties:
        node_id: {type: string}
        question: {type: string}
        asker: {$ref: "#/components/schemas/Asker"}
    Link:
      type: object
      description: One node of the why-tree, a labelled link from its parent (docs/causal-criteria.md)
      required: [node_id, claim, label]
      properties:
        node_id: {type: string}
        parent_id: {type: [string, "null"]}
        claim: {type: string}
        label: {type: string, enum: [breakdown, causal, leverage, background]}
        evidence_status: {type: string, enum: [evidenced, partially-evidenced, hypothesis]}
        share_explained: {type: number}
        residual: {type: number, description: "Share of the effect left unexplained (1 - share_explained); on a Loop B reconcile link it is signed: 1 - raw share, negative when the add-back over-explains (offsetting items)"}
        sql: {type: string}
        rows_ref: {type: string}
        depth: {type: integer}
        verdict: {type: string, enum: [root, accepted, pruned, frontier], description: What the critic decided}
        rule: {type: string, description: "Hypothesiser rule that proposed it, or reconcile for the Loop B add-back link"}
        reason: {type: string, description: The critic's reason}
        attempts: {type: integer, description: Analyst attempts (a critic retry adds one)}
        evidence: {type: array, items: {$ref: "#/components/schemas/EvidenceItem"}}
        proposed_by: {type: string, enum: [rules, model], description: "Who proposed the hypothesis; a model proposal is validated against the queryable vocabulary and tested like any other (ADR-0010)"}
        model_opinion:
          oneOf: [{$ref: "#/components/schemas/ModelOpinion"}, {type: "null"}]
          description: The deep model lane's advisory second opinion on the critic's verdict (live mode)
    ModelOpinion:
      type: object
      description: "Advisory second opinion from the deep lane (ADR-0010). The rule critic decides; a disagreement goes to the critic_escalation gate, whose auto policy keeps the rule verdict"
      required: [lane, requested_model, decision, label, grounded, agrees, rule_decision]
      properties:
        lane: {type: string}
        requested_model: {type: string}
        routed_model: {type: [string, "null"], description: "Model that answered, from the Nightshift receipt (explicit ids are not honoured)"}
        provider: {type: [string, "null"]}
        receipt_id: {type: [string, "null"]}
        decision: {type: string, enum: [accept, prune]}
        label: {type: string, enum: [breakdown, causal, background]}
        rationale: {type: [string, "null"], description: "One paragraph; null when it quoted a number not in the measurement"}
        grounded: {type: boolean}
        agrees: {type: boolean}
        rule_decision: {type: string}
        gate_choice: {type: [string, "null"], description: "critic_escalation choice when they disagreed (keep-rule or prune)"}
    EvidenceItem:
      type: object
      description: One query behind a claim; in sample mode the SQL that live mode would run
      required: [sql, source, row_count]
      properties:
        sql: {type: string}
        filter: {type: [string, "null"], description: Predicate applied to the returned rows}
        source: {type: string}
        row_count: {type: integer, description: Rows the query returned}
        matched: {type: integer, description: Rows that passed the filter (before the cap)}
        rows: {type: array, items: {type: object}, description: Relevant rows (capped)}
        degraded: {type: boolean}
        note: {type: [string, "null"]}
    Observation:
      type: object
      required: [value, concept, end]
      properties:
        value: {type: number}
        concept: {type: string}
        start: {type: [string, "null"]}
        end: {type: string}
        form: {type: [string, "null"]}
        filed: {type: [string, "null"]}
        accn: {type: [string, "null"]}
    Effect:
      type: object
      description: What the run explains (target minus baseline, like-for-like)
      required: [entity, metric, kind, period, baseline, target, delta, summary]
      properties:
        entity: {type: string}
        metric: {type: string}
        kind: {type: string, enum: [restatement, change]}
        period: {type: object, properties: {start: {type: string, format: date}, end: {type: string, format: date}}}
        baseline: {$ref: "#/components/schemas/Observation"}
        target: {$ref: "#/components/schemas/Observation"}
        delta: {type: number}
        relative_change: {type: [number, "null"]}
        summary: {type: string}
    EntityHint:
      type: object
      required: [relation, description]
      properties:
        relation: {type: string}
        source_ticker: {type: [string, "null"]}
        source_cik: {type: [string, "null"]}
        filing_accession: {type: [string, "null"]}
        filing_date: {type: [string, "null"]}
        filing_items: {type: array, items: {type: string}}
        description: {type: string}
    InformationNeed:
      type: object
      description: "Loop A to Loop B hand-off when no registered source can test a candidate. When every candidate was a ruled-out accounting event, variable is '<metric> by segment or product' and entity_hint.relation 'same entity, breakdown' (Loop B is skipped: no catalog source holds a breakdown)"
      required: [node_id, variable, entity_hint, period, join_key, test, reason]
      properties:
        node_id: {type: string}
        variable: {type: string}
        variable_aliases: {type: array, items: {type: string}}
        entity_hint: {$ref: "#/components/schemas/EntityHint"}
        period: {type: object, properties: {start: {type: string, format: date}, end: {type: string, format: date}}}
        join_key: {type: array, items: {type: string}}
        expected_magnitude: {type: [number, "null"]}
        test: {type: string}
        reason: {type: string}
    RunStats:
      type: object
      properties:
        hops: {type: integer}
        queries: {type: integer}
        sources_onboarded: {type: integer, description: "Sources registered by Loop B (at most MAX_NEW_SOURCES_PER_RUN)"}
        model_calls: {type: integer, description: "Nightshift calls made by the model lanes (at most MAX_MODEL_CALLS_PER_RUN, default 12); 0 at depth quick (the default) and always 0 in sample mode"}
        tokens: {type: integer, description: Total tokens the Nightshift replies reported}
        seconds: {type: number}
        retries: {type: integer, description: Critic send-backs to the analyst}
        prunes: {type: integer}
        gate_decisions: {type: integer}
    RunResult:
      type: object
      required: [run_id, status]
      description: Leads with the decision (ADR-0009) - end state and recommended action - then the evidence
      properties:
        end_state: {type: string, enum: [actionable, branched, cyclic, evidence-frontier, external-driver, budget], description: Absent when status is error}
        action: {type: [string, "null"], description: Recommended action for the asker}
        action_source: {type: string, enum: [template, model], description: "template: the rule template; model: worded by the fast model lane from the template and validated (no number or name absent from it; ADR-0010)"}
        action_template: {type: [string, "null"], description: "The template action, set only when the model's wording replaced it"}
        root_cause: {type: [string, "null"]}
        residual: {type: [number, "null"], description: "Share of the effect left unexplained; when the chosen link is a Loop B reconciliation it is signed (negative = over-explained)"}
        run_id: {type: string}
        parent_run_id: {type: [string, "null"]}
        parent_node_id: {type: [string, "null"], description: Node branched from (branch runs only)}
        status: {type: string, enum: [success, partial, error]}
        effect: {$ref: "#/components/schemas/Effect"}
        information_need: {$ref: "#/components/schemas/InformationNeed"}
        scope:
          oneOf: [{$ref: "#/components/schemas/ScopeCheck"}, {type: "null"}]
          description: "Set when the scope check stopped the run before Loop A (end state evidence-frontier, status partial): plain reasons and runnable alternatives"
        why_tree: {type: array, items: {$ref: "#/components/schemas/Link"}}
        stats: {$ref: "#/components/schemas/RunStats"}
        depth:
          oneOf: [{$ref: "#/components/schemas/RunDepth"}, {type: "null"}]
          description: "Investigation depth asked and run, the model lanes on and the expected wait (ADR-0011); stats.model_calls counts the calls made"
        trace_file: {type: string}
        sample_mode: {type: boolean}
        memory:
          oneOf: [{$ref: "#/components/schemas/RunMemory"}, {type: "null"}]
          description: "H-MEM use (ADR-0005): mode, lessons recalled and the critic's call on each, candidates skipped, feedback and the lesson stored. Set by run_investigation (the API, the CLI); null for Loop A only runs"
        error:
          type: [object, "null"]
          description: Set when status is error (a controlled failure, never a stack trace)
          properties: {type: {type: string}, message: {type: string}, recoverable: {type: boolean}}
    RunMemory:
      type: object
      description: "One run's memory (agents/memory.py). Lessons, never answers: a recalled lesson only reorders the hypothesiser's candidates; the critic tests every step again and rejects a lesson whose step it prunes"
      required: [mode, recalled, rejected, skipped, fallback, feedback]
      properties:
        mode: {type: string, enum: [warm, cold]}
        available: {type: [boolean, "null"], description: "Cognition answered the recall; false = the run went on without memory (one degraded trace line); null = cold or not reached"}
        namespace: {type: [string, "null"], description: MEMORY_NAMESPACE (default lessons)}
        query: {type: [string, "null"], description: "The recall query, built from the frame only (kind of effect, metric family, metric): no entity"}
        recalled: {type: array, items: {$ref: "#/components/schemas/RecalledLesson"}}
        rejected: {type: array, items: {type: string}, description: Memory ids the critic rejected for this run}
        skipped: {type: array, items: {$ref: "#/components/schemas/SkippedCandidate"}, description: "Candidates not tested because a recalled lesson's step held first (the source of the warm run's fewer hops)"}
        fallback: {type: boolean, description: "A lesson's shortcut reached no cause, so Loop A ran again testing every candidate (the stats include both passes)"}
        feedback: {type: array, items: {$ref: "#/components/schemas/MemoryFeedback"}}
        stored: {oneOf: [{$ref: "#/components/schemas/StoredLesson"}, {type: "null"}]}
        note: {type: [string, "null"]}
    RecalledLesson:
      type: object
      required: [memory_id, content, confidence, status]
      properties:
        memory_id: {type: string}
        content: {type: string}
        relevance: {type: [number, "null"], description: H-MEM recall score (at least RECALL_THRESHOLD)}
        confidence: {type: number}
        status: {type: string, enum: [supported, rejected, not-tested, ignored], description: "supported: its step held when tested; rejected: the critic pruned its step (negative feedback sent); not-tested: none of its steps came up; ignored: no path tags"}
        node_ids: {type: array, items: {type: string}, description: Nodes that tested its steps}
        reason: {type: [string, "null"]}
    SkippedCandidate:
      type: object
      required: [node_id, rule, variable, claim]
      properties:
        node_id: {type: string}
        rule: {type: string}
        variable: {type: string}
        claim: {type: string}
        memory_id: {type: [string, "null"]}
    MemoryFeedback:
      type: object
      required: [memory_id, kind, applied, reason]
      properties:
        memory_id: {type: string}
        kind: {type: string, enum: [helpful, not_helpful, wrong], description: "helpful: its path led to the end state; not_helpful: misapplied (learnt on another kind of question) or its shortcut reached no cause; wrong: its step was pruned on the kind of question it was learnt on"}
        applied: {type: boolean, description: Cognition confirmed the confidence update}
        reason: {type: string}
    StoredLesson:
      type: object
      required: [stored, reason]
      properties:
        stored: {type: boolean}
        memory_id: {type: [string, "null"], description: "The new lesson, or the existing one with the same path (not stored twice)"}
        content: {type: string, description: "Generic: no company name, ticker, CIK, amount or date"}
        tags: {type: array, items: {type: string}, description: "kind:<effect kind>, family:<metric family>, path:<rule>=<key>><outcome> per step, end:<end state>"}
        gate_choice: {type: [string, "null"], enum: [store, discard, null], description: The memory gate's decision}
        decided_by: {type: [string, "null"]}
        reason: {type: string}
    PurgeRequest:
      type: object
      properties:
        namespace: {type: [string, "null"], description: Omit to purge every namespace}
        requested_by: {type: [string, "null"], maxLength: 100, description: "Recorded in the ledger (default api)"}
    PurgeResult:
      type: object
      required: [status, purged, namespace, requested_by]
      properties:
        status: {const: purged}
        purged: {type: integer, description: Lessons cognition confirmed deleted}
        namespace: {type: [string, "null"], description: "null: every namespace"}
        requested_by: {type: string}
    ScopeReason:
      type: object
      required: [type, message]
      properties:
        type: {type: string, enum: [forecast, not-sec-registrant, not-in-sample]}
        message: {type: string}
        cue: {type: [string, "null"], description: "The words (or the future period) that triggered the forecast rule"}
    Alternative:
      type: object
      required: [basis, entity, registered, request]
      properties:
        basis: {type: string, description: "named in the question | same entity, past period | same SIC peer (<sic>)"}
        entity: {type: object, properties: {ticker: {type: string}, cik: {type: string}, name: {type: [string, "null"]}}}
        registered: {type: boolean, description: "false = an SEC registrant the run registers first (cold)"}
        checks: {type: array, items: {type: string}, description: What was validated against data}
        request: {$ref: "#/components/schemas/RunRequest"}
    ScopeCheck:
      type: object
      required: [in_scope]
      properties:
        in_scope: {type: boolean}
        reasons: {type: array, items: {$ref: "#/components/schemas/ScopeReason"}}
        alternatives: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/Alternative"}}
        note: {type: [string, "null"]}
    Suggestion:
      type: object
      required: [kind, basis, question, metric, period, baseline, target, delta, request]
      properties:
        kind: {type: string, enum: [restatement, change]}
        basis: {type: string, description: "restatement | largest change | lowest value | highest value | latest change"}
        question: {type: string}
        metric: {type: string}
        period: {type: object, properties: {start: {type: string, format: date}, end: {type: string, format: date}}}
        baseline: {$ref: "#/components/schemas/Observation"}
        target: {$ref: "#/components/schemas/Observation"}
        delta: {type: number}
        relative_change: {type: [number, "null"]}
        checks: {type: array, items: {type: string}}
        request: {$ref: "#/components/schemas/RunRequest"}
    ExpectedWait:
      type: object
      required: [min_seconds, max_seconds, basis]
      properties:
        min_seconds: {type: number}
        max_seconds: {type: number}
        basis: {type: string}
    DepthWaits:
      type: object
      description: Expected wall time of a first full investigation at each depth (ADR-0011; config.FIRST_RUN_SECONDS + config.MODEL_SECONDS)
      required: [quick, thorough, deep]
      properties:
        quick: {$ref: "#/components/schemas/ExpectedWait"}
        thorough: {$ref: "#/components/schemas/ExpectedWait"}
        deep: {$ref: "#/components/schemas/ExpectedWait"}
    RunDepth:
      type: object
      description: "The investigation depth of a run (ADR-0011): asked, run, and the expected wait. Precedence: sample mode runs quick at every depth; MODEL_LANES=off forces quick; else options.depth, else the deprecated options.model_lanes (on = deep, off = quick), else MODEL_LANES=on = deep, else quick. A depth with model lanes and no configured Nightshift Runtime (or MAX_MODEL_CALLS_PER_RUN=0) runs as quick, degraded"
      required: [requested, requested_by, effective, lanes, degraded, note, expected_wait]
      properties:
        requested: {type: string, enum: [quick, thorough, deep], description: The depth asked for (quick when nothing asked)}
        requested_by: {type: string, enum: [options.depth, options.model_lanes, MODEL_LANES, default]}
        effective: {type: string, enum: [quick, thorough, deep], description: "The depth that runs"}
        lanes: {type: array, items: {type: string, enum: [hypothesiser, critic, reporter]}, description: Model lanes on for the run (empty at quick)}
        degraded: {type: boolean, description: "Model lanes were asked for but could not run (no configured Runtime, cap 0, or Nightshift became unavailable during the run)"}
        note: {type: string, description: Why the effective depth is what it is}
        expected_wait: {$ref: "#/components/schemas/ExpectedWait"}
    EntityInfo:
      type: object
      required: [cik, ticker, tier, expected_first_run, expected_first_run_by_depth]
      properties:
        cik: {type: string}
        ticker: {type: string}
        name: {type: string}
        tier: {type: string, enum: [ready, searchable]}
        metrics: {type: array, items: {type: string}, description: Supported metrics with registered data}
        expected_first_run: {$ref: "#/components/schemas/ExpectedWait", description: "At the default depth (quick, rules only)"}
        expected_first_run_by_depth: {$ref: "#/components/schemas/DepthWaits", description: "At each depth, so a UI can warn before the run starts (ADR-0011)"}
    EntityList:
      type: object
      required: [mode, entities, searchable]
      properties:
        mode: {type: string, enum: [sample, live]}
        query: {type: [string, "null"]}
        entities: {type: array, items: {$ref: "#/components/schemas/EntityInfo"}}
        searchable: {type: boolean, description: Whether tiresias.sec_tickers was searched}
        note: {type: [string, "null"]}
        degraded: {type: boolean}
    SuggestionList:
      type: object
      required: [mode, entity, suggestions]
      properties:
        mode: {type: string, enum: [sample, live]}
        entity: {$ref: "#/components/schemas/EntityInfo"}
        suggestions: {type: array, items: {$ref: "#/components/schemas/Suggestion"}}
        considered: {type: integer, description: Candidate questions derived from the data}
        rejected: {type: integer, description: Candidates that failed validation}
        note: {type: [string, "null"]}
    Error:
      type: object
      required: [status, error]
      properties:
        run_id: {type: string}
        status: {const: error}
        error:
          type: object
          required: [type, message]
          properties: {type: {type: string}, message: {type: string}, recoverable: {type: boolean}}
