# Cloud Run service for the hosted demo: at most one instance, the agent with cognition (H-MEM)
# as a sidecar on localhost, as in compose.yaml. Sample mode only (PUBLIC_DEMO), no secrets.
# deploy.sh fills in AGENT_IMAGE, COGNITION_IMAGE and RUN_SERVICE_ACCOUNT.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tiresias
  labels:
    app: tiresias
  annotations:
    run.googleapis.com/ingress: all
    # Public without an allUsers IAM binding (works where an organisation policy restricts IAM
    # members to its own domain).
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        # Max 1: runs and H-MEM lessons live in that instance's memory, and the UI follows a run
        # (SSE, gates) on the instance that started it. Min 0, set explicitly rather than left to
        # the default: with no traffic the service scales to zero and bills nothing (min 1 cost
        # about US$1.06 a day idle). A run the UI follows holds its SSE request (POST /run holds its
        # own), so the instance stays up until it ends; a POST /runs nobody follows holds none. The
        # cost is a cold start after a quiet spell.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/container-dependencies: '{"agent": ["cognition"]}'
    spec:
      serviceAccountName: RUN_SERVICE_ACCOUNT
      containerConcurrency: 40
      timeoutSeconds: 900
      containers:
        - name: agent
          image: AGENT_IMAGE
          ports:
            - containerPort: 8000
          env:
            - {name: SAMPLE_MODE, value: "true"}
            - {name: PUBLIC_DEMO, value: "true"}
            - {name: HITL_MODE, value: "auto"}
            - {name: GATE_TIMEOUT_SECONDS, value: "30"}   # backstop behind the UI's 5 s prompt
            - {name: COGNITION_URL, value: "http://localhost:8100"}
            - {name: MAX_CONCURRENT_RUNS, value: "4"}
          resources:
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
        - name: cognition
          image: COGNITION_IMAGE
          env:
            - {name: COGNITION_PORT, value: "8100"}
          resources:
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            tcpSocket: {port: 8100}
            periodSeconds: 2
            failureThreshold: 30
