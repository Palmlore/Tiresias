# Local-first stack (ADR-0008). Zetaris and Nightshift run outside this file (see deploy/README.md).
services:
  agent:
    # Context is the repo root so the image includes data/sample, zetaris/sql, catalog and
    # input_examples (see .dockerignore); SAMPLE_MODE=true then works with an empty .env.
    build: {context: ., dockerfile: services/agent/Dockerfile}
    ports: ["${AGENT_PORT:-8000}:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      COGNITION_URL: http://cognition:8100
      AGENT_PORT: "8000"            # the port inside the container; publish another with AGENT_PORT in .env
    volumes: ["./logs:/app/logs"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      cognition: {condition: service_started}
  cognition:
    build: ./services/cognition
    ports: ["${COGNITION_PORT:-8100}:8100"]
    env_file: [{path: .env, required: false}]
    volumes: ["./logs:/app/logs", "memory:/app/.memory"]
volumes:
  memory:
