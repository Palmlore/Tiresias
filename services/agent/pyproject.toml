[project]
name = "tiresias-agent"
version = "0.1.0"
description = "Tiresias agent service: orchestrator, agents, Zetaris adapter, Nightshift client"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiresias_agent"]

[tool.ruff]
line-length = 100
